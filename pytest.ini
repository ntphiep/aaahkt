[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=backend
    --cov-report=term-missing
    --cov-report=html
asyncio_mode = auto

[coverage:run]
source = backend
omit = 
    backend/tests/*
    */venv/*
    */env/*
